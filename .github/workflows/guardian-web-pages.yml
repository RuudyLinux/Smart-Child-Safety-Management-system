name: Guardian web (GitHub Pages)

# Builds the Flutter guardian app for the web and publishes it on GitHub Pages (free for public repositories).
# The API address is the repository variable API_BASE_URL (Settings > Secrets and variables > Variables);
# it is not a secret and is baked into the build, never hardcoded in the repo.
on:
  workflow_dispatch:
  push:
    branches: [master, feature/production-free]
    paths:
      - guardian_app/**
      - .github/workflows/guardian-web-pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the API address
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then echo "Set the repository variable API_BASE_URL (https://...)"; exit 1; fi
          case "$API_BASE_URL" in https://*) ;; *) echo "API_BASE_URL must be https"; exit 1;; esac
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: guardian_app
      - run: flutter analyze
        working-directory: guardian_app
      - run: flutter test
        working-directory: guardian_app
      - name: Build web
        working-directory: guardian_app
        run: >
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guardian_app/build/web

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
